<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password | Karibu Directory</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site">
  <div class="nav">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 26 26" fill="none" stroke="#0F5C4A" stroke-width="1.8"><circle cx="13" cy="13" r="10"/><path d="M9 13.2l2.6 2.6L17.5 10" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Karibu Directory
    </a>
    <nav class="nav-links" id="navLinks" style="display:flex; position:static; border:none; padding:0; flex-direction:row;">
      <a href="search.html">Browse all</a>
    </nav>
  </div>
</header>

<main>
  <section>
    <div class="form-card">
      <h1 style="font-size:1.5rem; margin-bottom:6px;">Reset your password</h1>
      <p class="muted" style="margin-bottom:24px;">Enter your email and we'll send you a reset link.</p>

      <form id="forgotForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Send reset link</button>
      </form>

      <p class="muted" style="margin-top:18px; text-align:center;">
        <a href="login.html">Back to log in</a>
      </p>
    </div>
  </section>
</main>

<script src="assets/js/api.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const data = await apiRequest('/auth/forgot-password', {
      method: 'POST', body: { email: document.getElementById('email').value }
    });
    toast(data.message, 'success');
  } catch (err) {
    toast(err.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Send reset link';
  }
});
</script>

</body>
</html>
