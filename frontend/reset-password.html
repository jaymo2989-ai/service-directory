<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a new password | Karibu Directory</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site">
  <div class="nav">
    <a href="index.html" class="brand">
      <svg viewBox="0 0 26 26" fill="none" stroke="#0F5C4A" stroke-width="1.8"><circle cx="13" cy="13" r="10"/><path d="M9 13.2l2.6 2.6L17.5 10" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Karibu Directory
    </a>
    <nav class="nav-links" id="navLinks" style="display:flex; position:static; border:none; padding:0; flex-direction:row;">
      <a href="search.html">Browse all</a>
    </nav>
  </div>
</header>

<main>
  <section>
    <div class="form-card">
      <h1 style="font-size:1.5rem; margin-bottom:6px;">Set a new password</h1>
      <p class="muted" style="margin-bottom:24px;">Choose a new password for your account.</p>

      <form id="resetForm">
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" required minlength="8">
          <p class="field-hint">At least 8 characters.</p>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Update password</button>
      </form>
    </div>
  </section>
</main>

<script src="assets/js/api.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get('token');

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!token) return toast('This reset link is missing its token — request a new one.', 'error');
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Updating…';
  try {
    await apiRequest('/auth/reset-password', {
      method: 'POST',
      body: { token, newPassword: document.getElementById('newPassword').value }
    });
    toast('Password updated — you can log in now', 'success');
    setTimeout(() => window.location.href = 'login.html', 1000);
  } catch (err) {
    toast(err.message, 'error');
    btn.disabled = false; btn.textContent = 'Update password';
  }
});
</script>

</body>
</html>
